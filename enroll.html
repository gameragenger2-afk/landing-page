<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Enrollment</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <img src="logo.png" alt="Federal Digital Protection Initiative">
      </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="enroll.html">Contact</a></li>
        <li><a href="enroll.html">Support</a></li>
      </ul>
    </nav>
  </header>

  <section class="enrollment">
    <div class="order-summary">
      <h2>Order Summary</h2>
      <p>Federal Protection Plan - 30-Day Initial Coverage: $1.00</p>
      <p>Recurring Protection (After 30 Days): $9.90 / month</p>
      <p>Total Due Today: $1.00</p>
    </div>

    <div class="payment-form">
      <h2>Payment Information</h2>
      <form>
        <label for="full-name">Full Legal Name</label>
        <input type="text" id="full-name" name="full-name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="card-number">Card Number</label>
        <input type="text" id="card-number" name="card-number" required>

        <label for="expiry">Expiry (MM/YY)</label>
        <input type="text" id="expiry" name="expiry" required>

        <label for="cvc">CVC</label>
        <input type="text" id="cvc" name="cvc" required>

        <label for="auto-pay">
          <input type="checkbox" id="auto-pay" name="auto-pay"> Enable Auto-Pay Protection
        </label>

        <button type="submit" class="cta-btn">Pay $1.00 & Enroll</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-links">
      <a href="#">Privacy Policy</a> | 
      <a href="#">Terms of Service</a> | 
      <a href="#">Accessibility</a>
    </div>
    <div class="footer-contact">
      <p>1-800-SAFE-USA | help@federalprotection.gov</p>
    </div>
  </footer>
</body>
</html>
